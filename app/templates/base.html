<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { padding: 24px; }
      .table thead th { cursor: pointer; }
      .footer { color: #666; font-size: 0.9rem; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <header class="mb-4">
        <h1 class="h3">{{ title }}</h1>
      </header>
      {% block content %}{% endblock %}
      <div class="footer">Powered by FastAPI · PostgreSQL</div>
    </div>
    <script>
      function sortTable(table, colIndex) {
        const tbody = table.tBodies[0];
        const rows = Array.from(tbody.querySelectorAll('tr'));
        const asc = table.getAttribute('data-sort-col') != colIndex || table.getAttribute('data-sort-dir') === 'desc';
        rows.sort((a, b) => {
          const av = a.children[colIndex].innerText.trim();
          const bv = b.children[colIndex].innerText.trim();
          const na = parseFloat(av); const nb = parseFloat(bv);
          if (!isNaN(na) && !isNaN(nb)) return asc ? na - nb : nb - na;
          return asc ? av.localeCompare(bv) : bv.localeCompare(av);
        });
        rows.forEach(r => tbody.appendChild(r));
        table.setAttribute('data-sort-col', colIndex);
        table.setAttribute('data-sort-dir', asc ? 'asc' : 'desc');
      }
      document.addEventListener('click', (e) => {
        const th = e.target.closest('th');
        if (!th) return;
        const table = th.closest('table');
        if (!table) return;
        sortTable(table, th.cellIndex);
      });
    </script>
  </body>
</html>
